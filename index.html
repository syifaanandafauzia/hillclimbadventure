<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hill Climb Adventure</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #87ceeb;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
    }

    .hud {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px;
      background: #173344dd;
      color: white;
      border-radius: 12px;
      font-weight: bold;
      line-height: 1.8;
      font-size: 14px;
    }

    .fuel-container {
      width: 150px;
      height: 10px;
      background: #555;
      border-radius: 10px;
      overflow: hidden;
    }

    #fuelBar {
      width: 100%;
      height: 100%;
      background: #4ade80;
    }

    .controls {
      position: fixed;
      bottom: 22px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: none;
    }

    .group {
      display: flex;
      gap: 12px;
    }

    .ctrl {
      width: 75px;
      height: 75px;
      border: 3px solid #ffffffaa;
      border-radius: 20px;
      color: white;
      background: #173344cc;
      font-size: 28px;
      font-weight: bold;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
    }

    .ctrl:active {
      background: #f59e0b;
    }

    #message {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: #0009;
      color: white;
      text-align: center;
    }

    .panel {
      background: #173344;
      padding: 25px;
      margin: 20px;
      border-radius: 18px;
    }

    .panel button {
      padding: 12px 24px;
      border: 0;
      border-radius: 10px;
      background: #f59e0b;
      font-weight: bold;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <canvas id="game"></canvas>

  <div class="hud">
    🪙 Koin: <span id="coins">0</span><br>
    📏 Jarak: <span id="distance">0</span> m<br>
    ⛽ BBM: <span id="fuelText">100%</span>

    <div class="fuel-container">
      <div id="fuelBar"></div>
    </div>
  </div>

  <div class="controls">
    <div class="group">
      <button class="ctrl" id="brake">◀</button>
    </div>

    <div class="group">
      <button class="ctrl" id="gas">▶</button>
    </div>
  </div>

  <div id="message">
    <div class="panel">
      <h1 id="endTitle">Game Over!</h1>
      <p id="endInfo"></p>
      <button onclick="restart()">Main Lagi 🔄</button>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
